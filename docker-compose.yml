services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # Host 5433 avoids conflict with a local Postgres on 5432
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jenns40th
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
